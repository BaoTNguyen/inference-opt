<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseline vs Optimized</title>
<style>
:root {
  --page: #efeee9; --win: #0c0c0c; --bar: #121212; --line: #262626; --ink: #e2e2e2; --dim: #8a8a8a;
  --faint: #6a6a6a; --think: #747474; --accent: #d95926; --base: #3987e5; --grid: #222;
  /* series colors: validated pair (dataviz validate_palette.js, dark, surface #0c0c0c): all checks pass, CVD dE 26.8 */
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); font-family: var(--mono); color: var(--ink); }
.win { max-width: 1500px; margin: 32px auto; background: var(--win); border: 1px solid #000; }
.title { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dots span { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: #2c2c2c; margin-right: 7px; }
.title h1 { flex: 1; text-align: center; margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .28em; color: var(--dim); text-transform: uppercase; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.controls button { font: inherit; letter-spacing: inherit; text-transform: inherit; background: transparent; color: var(--dim);
  border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; }
.controls button[aria-pressed="true"] { color: var(--ink); border-color: var(--dim); }
.controls button.go { color: var(--accent); border-color: var(--accent); margin-left: auto; }
.controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls .note { color: var(--faint); }
.grid { display: grid; grid-template-columns: 1fr 1fr; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.side:last-child { border-right: 0; }
.stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; column-gap: 40px; row-gap: 6px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.stats .k { font-size: 12px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.stats .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bench { padding: 8px 22px; font-size: 11px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; border-bottom: 1px solid var(--line); }
.who { display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-bottom: 1px solid var(--line); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; }
.who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--base); }
.side.best .who .dot { background: var(--accent); }
.side.lead .who { color: var(--ink); }
.who .cfg { margin-left: auto; font-size: 11px; letter-spacing: .06em; color: var(--faint); text-transform: none; }
.body { scrollbar-color: #333 transparent; height: 52vh; min-height: 320px; overflow-y: auto; padding: 18px 22px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.body .think { color: var(--think); }
.body .lbl { display: block; font-size: 11px; letter-spacing: .2em; color: var(--faint); margin: 4px 0 6px; }
.cursor::after { content: "▌"; color: var(--ink); }
.foot { padding: 14px 22px 18px; }
.track { height: 2px; background: var(--line); }
.fill { height: 2px; width: 0; background: var(--base); }
.side.best .fill { background: var(--accent); }
.state { margin-top: 12px; font-size: 13px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.side.best .state { color: var(--accent); }
.side.base .state { color: var(--base); }
.prompt { padding: 12px 22px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim); white-space: pre-wrap; max-height: 5.2em; overflow: hidden; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .side { border-right: 0; border-bottom: 1px solid var(--line); } .body { height: 38vh; } .win { margin: 0; } }

.charts { border-top: 1px solid var(--line); padding: 22px; }
.charts h2 { margin: 0 0 6px; font-size: 14px; font-weight: 500; letter-spacing: .24em; color: var(--dim); text-transform: uppercase; }
.legend { display: flex; gap: 22px; font-size: 12px; letter-spacing: .1em; color: var(--ink); margin: 10px 0 18px; text-transform: uppercase; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { border: 1px solid var(--line); padding: 14px 16px 10px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h3 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .16em; color: var(--ink); text-transform: uppercase; }
.card p { margin: 4px 0 8px; font-size: 11px; color: var(--faint); letter-spacing: .04em; }
.card svg { width: 100%; height: auto; display: block; }
.card svg text { font-family: var(--mono); fill: var(--dim); font-size: 11px; }
.card svg .val { fill: var(--ink); font-size: 11px; }
#tip { position: fixed; pointer-events: none; background: #1b1b1b; border: 1px solid #3a3a3a; color: var(--ink); font-size: 12px;
  padding: 6px 9px; display: none; z-index: 5; white-space: nowrap; }
details { margin-top: 16px; font-size: 12px; color: var(--dim); }
details summary { cursor: pointer; letter-spacing: .14em; text-transform: uppercase; }
details table { border-collapse: collapse; margin-top: 10px; width: 100%; }
details th, details td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
details th:first-child, details td:first-child { text-align: left; }
details th { color: var(--dim); font-weight: 500; }
@media (max-width: 820px) { .cgrid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .cursor::after { content: ""; } }
</style>
</head>
<body>
<div class="win">
  <div class="title"><div class="dots"><span></span><span></span><span></span></div>
    <h1>Qwen3.8-27B · Baseline vs Optimized · 2× RTX 3090</h1><div class="dots" aria-hidden="true" style="visibility:hidden"><span></span><span></span><span></span></div></div>
  <div class="controls" id="tabs"><a href="/" style="color:var(--dim);text-decoration:none">← live run</a><span class="note">replay at recorded speed</span><button class="go" id="go" type="button">Replay ▶</button></div>
  <div class="prompt" id="prompt"></div>
  <div class="grid" id="grid"></div>
  <section class="charts" id="charts" aria-label="Baseline vs optimized charts">
    <h2>Measured comparison · full benchmark runs, no recording</h2>
    <div class="legend"><span><i style="background:var(--base)"></i>Baseline: vLLM 0.27.1 defaults, no drafting</span><span><i style="background:var(--accent)"></i>Optimized: vLLM 0.32, DFlash2 W4A16, full CUDA graphs</span></div>
    <div class="cgrid" id="cgrid"></div>
    <details><summary>Table view</summary><table id="ctable"></table></details>
  </section>
</div>
<div id="tip" role="tooltip"></div>
<script>
const DATA = /*DATA*/null;
const order = ["base", "best"], names = { base: "Baseline", best: "Optimized" };
const $ = (s, r = document) => r.querySelector(s);
const grid = $("#grid"), tabs = $("#tabs");
let pick = 0, raf = null, t0 = 0;

const panes = {};
for (const s of order) {
  const d = DATA[s], b = d.bench;
  const el = document.createElement("section");
  el.className = "side " + s;  // color follows the entity (base blue, best orange), never the rank
  el.innerHTML = `
    <div class="stats">
      <div class="k">Output tok/s</div><div class="k">TTFT</div><div class="k">Tokens</div><div class="k">Elapsed</div>
      <div class="v" data-k="tps">–</div><div class="v" data-k="ttft">–</div><div class="v" data-k="tok">0</div><div class="v" data-k="el">0.0s</div>
    </div>
    <div class="bench">40-request benchmark: ${b.tpm.toLocaleString()} TPM · ${b.tps_p50.toFixed(1)} tok/s p50 · TTFT p95 ${b.ttft_p95.toFixed(2)}s</div>
    <div class="who"><span class="dot"></span><span>${names[s]}</span><span data-k="rank"></span><span class="cfg">${d.label.split(": ")[1] || ""}</span></div>
    <div class="body" data-k="body" aria-live="off"></div>
    <div class="foot"><div class="track"><div class="fill" data-k="fill"></div></div><div class="state" data-k="state">Ready</div></div>`;
  grid.append(el);
  panes[s] = { el, get: k => el.querySelector(`[data-k="${k}"]`) };
}

DATA.base.requests.forEach((r, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = r.id.split("-")[0].replace("gsm8k", "GSM8K").replace("ifeval", "IFEval").replace("chat", "Chat");
  b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => { pick = i; tabs.querySelectorAll("button:not(.go)").forEach((x, j) => x.setAttribute("aria-pressed", j === i)); reset(); };
  tabs.insertBefore(b, $("#go"));
});

function reset() {
  cancelAnimationFrame(raf);
  $("#prompt").textContent = DATA.base.requests[pick].prompt;
  for (const s of order) {
    const p = panes[s]; p.i = 0; p.kind = null; p.done = false; p.span = null;
    p.get("body").innerHTML = ""; p.get("fill").style.width = "0";
    p.get("tps").textContent = "–"; p.get("ttft").textContent = "–"; p.get("tok").textContent = "0"; p.get("el").textContent = "0.0s";
    p.get("state").textContent = "Ready"; p.get("rank").textContent = "";
  }
}

function frame(now) {
  const t = (now - t0) / 1000;
  let live = 0;
  for (const s of order) {
    const p = panes[s], r = DATA[s].requests[pick], ev = r.events, body = p.get("body");
    while (p.i < ev.length && ev[p.i][0] <= t) {
      const [, kind, text] = ev[p.i];
      if (kind !== p.kind) {
        if (p.span) p.span.classList.remove("cursor");
        const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = kind === "thinking" ? "THINKING" : "ANSWER";
        body.append(lbl);
        p.span = document.createElement("span"); if (kind === "thinking") p.span.className = "think";
        body.append(p.span); p.kind = kind;
      }
      p.span.textContent += text; p.i++;
    }
    const last = p.i ? ev[p.i - 1] : null, n = last && last[3] ? last[3] : 0;
    if (p.span) p.span.classList.toggle("cursor", p.i < ev.length);
    if (r.ttft != null && t >= r.ttft) p.get("ttft").textContent = r.ttft.toFixed(2) + "s";
    p.get("tok").textContent = n;
    p.get("fill").style.width = (100 * Math.min(1, n / r.tokens)) + "%";
    if (p.i >= ev.length) {
      if (!p.done) { p.done = true; p.get("tps").textContent = r.decode_tps.toFixed(1); p.get("el").textContent = r.latency.toFixed(1) + "s";
        p.get("state").textContent = `Done in ${r.latency.toFixed(1)}s`; }
    } else {
      live++;
      p.get("el").textContent = t.toFixed(1) + "s";
      if (r.ttft != null && t > r.ttft + 0.3 && n > 1) p.get("tps").textContent = ((n - 1) / (t - r.ttft)).toFixed(1);
      p.get("state").textContent = t < (r.ttft ?? 0) ? "Prefill…" : "Streaming…";
      body.scrollTop = body.scrollHeight;
    }
  }
  // lead = higher decode speed for this prompt (known from the recording); shown once both have started
  const tb = DATA.base.requests[pick].decode_tps, to = DATA.best.requests[pick].decode_tps;
  if (t > Math.max(DATA.base.requests[pick].ttft, DATA.best.requests[pick].ttft)) {
    const lead = to >= tb ? "best" : "base", trail = lead === "best" ? "base" : "best";
    panes[lead].get("rank").textContent = "· #1"; panes[trail].get("rank").textContent = "· #2";
  }
  if (live) raf = requestAnimationFrame(frame);
}

$("#go").onclick = () => { reset(); t0 = performance.now(); raf = requestAnimationFrame(frame); };
reset();

// ---------- comparison charts (all numbers from recorded runs, built into DATA.charts by race.py) ----------
(() => {
  const C = DATA.charts; if (!C) return;
  const col = { base: "var(--base)", best: "var(--accent)" }, nm = { base: "Baseline", best: "Optimized" };
  const tip = $("#tip"), cg = $("#cgrid");
  const show = (e, html) => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; };
  const hide = () => { tip.style.display = "none"; };
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.append(n); return n; };
  // bar with a 4px rounded data-end, flat at the baseline
  const barPath = (x, y, w, h) => { const r = Math.min(4, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
  const nice = range => { const p = Math.pow(10, Math.floor(Math.log10(range))); return [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10].map(m => m * p).find(s => range / s <= 5); };  // step giving <= 5 gridlines
  function card(title, sub, wide) { const c = document.createElement("div"); c.className = "card" + (wide ? " wide" : ""); c.innerHTML = `<h3>${title}</h3><p>${sub}</p>`; cg.append(c); return c; }

  function grouped(title, sub, groups, key, fmt, ref, cap) {
    const W = 560, H = 230, m = { l: 46, r: 10, t: 22, b: 30 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const vals = groups.flatMap(g => ["base", "best"].map(s => g.v[s] && g.v[s][key]).filter(v => v != null));
    if (!vals.length) return;
    let max = Math.max(...vals, ref ? ref.v : 0) * 1.15; if (cap) max = Math.min(max, cap); const step = nice(max); max = Math.ceil(max / step) * step;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title }, card(title, sub));
    for (let v = 0; v <= max + 1e-9; v += step) { const y = m.t + ih - v / max * ih;
      el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: "var(--grid)" }, svg);
      el("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, svg).textContent = fmt(v, true); }
    const gw = iw / groups.length, bw = Math.min(56, gw * 0.3);
    groups.forEach((g, gi) => { const cx = m.l + gw * gi + gw / 2;
      el("text", { x: cx, y: H - 8, "text-anchor": "middle" }, svg).textContent = g.name;
      ["base", "best"].forEach((s, si) => { const v = g.v[s] && g.v[s][key]; if (v == null) return;
        const x = cx + (si ? 1 : -1 - bw) + (si ? 1 : 0) - (si ? 0 : 0), h = v / max * ih, y = m.t + ih - h;
        const b = el("path", { d: barPath(si ? cx + 1 : cx - 1 - bw, y, bw, h), fill: col[s] }, svg);   // 2px gap between the pair
        el("text", { x: (si ? cx + 1 : cx - 1 - bw) + bw / 2, y: y - 6, "text-anchor": "middle", class: "val" }, svg).textContent = fmt(v);
        const hit = el("rect", { x: si ? cx + 1 : cx - 1 - bw - 4, y: m.t, width: bw + 4, height: ih, fill: "transparent" }, svg);
        hit.addEventListener("mousemove", e => show(e, `${g.name} · ${nm[s]}<br>${title}: <b>${fmt(v)}</b>${g.v[s].label ? `<br><span style="color:var(--faint)">${g.v[s].label}</span>` : ""}`));
        hit.addEventListener("mouseleave", hide); }); });
    if (ref) { const y = m.t + ih - ref.v / max * ih;
      el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: "var(--ink)", "stroke-dasharray": "4 4", "stroke-width": 1 }, svg);
      el("text", { x: W - m.r, y: y - 5, "text-anchor": "end" }, svg).textContent = ref.label; }
  }
  const B = C.bench, groups = Object.keys(B).map(name => ({ name, v: B[name] })).filter(g => g.v.base || g.v.best);  // only benchmarks with speed runs
  const n1 = (v, axis) => axis ? String(Math.round(v)) : v.toFixed(1), tpm = (v, axis) => axis ? (v >= 1000 ? (v / 1000) + "k" : String(v)) : Math.round(v).toLocaleString();
  grouped("Decode speed, typical (p50)", "tok/s per request, 40 requests · higher is better", groups, "p50", n1, { v: 60, label: "gate ≥ 60" });
  grouped("Decode speed, slowest 5% (p5)", "tok/s per request · higher is better", groups, "p5", n1);
  grouped("Time to first token, p95", "seconds · lower is better", groups, "ttft95", (v, axis) => axis ? v.toFixed(2) : v.toFixed(2) + "s", { v: 1, label: "gate < 1 s" });
  grouped("Output tokens per minute", "one request at a time · higher is better", groups, "tpm", tpm);
  if (C.acc.base || C.acc.best) {
    const ag = ["GSM8K Platinum", "IFEval"].map(name => ({ name, v: { base: C.acc.base && { a: C.acc.base[name] }, best: C.acc.best && { a: C.acc.best[name] } } }));
    grouped("Accuracy", "100 questions each · GSM8K by final answer, IFEval prompt-level strict · higher is better", ag, "a", (v, axis) => axis ? Math.round(v) + "%" : v.toFixed(0) + "%", null, 100);
  }
  // every chat request as a dot: the whole spread, not just percentiles
  (() => { if (!C.dist.base.length) return;
    const W = 1140, H = 150, m = { l: 92, r: 14, t: 16, b: 26 }, iw = W - m.l - m.r;
    const all = [...C.dist.base, ...C.dist.best]; const step = nice(Math.max(...all)); const max = Math.ceil(Math.max(...all) * 1.05 / step) * step;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Per-request decode speed, chat" }, card("Every chat request", "decode tok/s of each of the 40 chat requests · dots are jittered vertically", true));
    const X = v => m.l + v / max * iw;
    for (let v = 0; v <= max + 1e-9; v += step) { el("line", { x1: X(v), x2: X(v), y1: m.t, y2: H - m.b, stroke: "var(--grid)" }, svg);
      el("text", { x: X(v), y: H - 8, "text-anchor": "middle" }, svg).textContent = Math.round(v); }
    el("line", { x1: X(60), x2: X(60), y1: m.t, y2: H - m.b, stroke: "var(--ink)", "stroke-dasharray": "4 4" }, svg);
    el("text", { x: X(60) + 4, y: m.t + 10 }, svg).textContent = "gate 60";
    [["base", 0], ["best", 1]].forEach(([s, row]) => { const yc = m.t + 26 + row * 50;
      el("text", { x: m.l - 10, y: yc + 4, "text-anchor": "end" }, svg).textContent = nm[s];
      C.dist[s].forEach((v, i) => { const y = yc + ((i * 37) % 17 - 8);
        const d = el("circle", { cx: X(v), cy: y, r: 4.5, fill: col[s], stroke: "#0c0c0c", "stroke-width": 2 }, svg);  // 2px surface ring
        d.addEventListener("mousemove", e => show(e, `${nm[s]} · chat request ${i + 1}<br><b>${v.toFixed(1)} tok/s</b>`)); d.addEventListener("mouseleave", hide); }); }); })();
  // speed vs TTFT for every chat request: both gates on one picture
  (() => { const P = C.scatter; if (!P || !P.base.length) return;
    const W = 560, H = 300, m = { l: 48, r: 14, t: 18, b: 40 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const all = [...P.base, ...P.best];
    const xmax = Math.ceil(Math.max(1.1, ...all.map(d => d[0])) * 10) / 10, ys = nice(Math.max(...all.map(d => d[1])));
    const ymax = Math.ceil(Math.max(...all.map(d => d[1])) * 1.08 / ys) * ys;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Decode speed against time to first token, every chat request" },
      card("Every request vs both gates", "each dot is one chat request · pass = left of the TTFT line and above the speed line"));
    const X = v => m.l + v / xmax * iw, Y = v => m.t + ih - v / ymax * ih;
    for (let v = 0; v <= ymax + 1e-9; v += ys) { el("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--grid)" }, svg);
      el("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end" }, svg).textContent = Math.round(v); }
    for (let v = 0; v <= xmax + 1e-9; v += 0.25) el("text", { x: X(v), y: H - 22, "text-anchor": "middle" }, svg).textContent = v.toFixed(2);
    el("text", { x: m.l + iw / 2, y: H - 6, "text-anchor": "middle" }, svg).textContent = "time to first token (s)";
    el("line", { x1: X(1), x2: X(1), y1: m.t, y2: m.t + ih, stroke: "var(--ink)", "stroke-dasharray": "4 4" }, svg);
    el("text", { x: X(1) - 4, y: m.t + 10, "text-anchor": "end" }, svg).textContent = "TTFT gate 1 s";
    el("line", { x1: m.l, x2: W - m.r, y1: Y(60), y2: Y(60), stroke: "var(--ink)", "stroke-dasharray": "4 4" }, svg);
    el("text", { x: X(1) - 6, y: Y(60) + 15, "text-anchor": "end" }, svg).textContent = "speed gate 60 tok/s";  // below the line, right of the dots
    ["base", "best"].forEach(s => P[s].forEach(([tt, v], i) => {
      const d = el("circle", { cx: X(tt), cy: Y(v), r: 4.5, fill: col[s], stroke: "#0c0c0c", "stroke-width": 2 }, svg);
      d.addEventListener("mousemove", e => show(e, `${nm[s]} · request ${i + 1}<br>TTFT <b>${tt.toFixed(2)} s</b> · <b>${v.toFixed(1)} tok/s</b>`)); d.addEventListener("mouseleave", hide); })); })();
  // draft-length sweeps: neutral bars (these runs are neither baseline nor final), chosen length outlined
  (() => { const SW = C.sweeps; if (!SW) return;
    const c = card("Draft length: tuned, not guessed", "output TPM on the 40-request chat benchmark per draft length · acceptance = drafted tokens the main model kept", true);
    const wrap = document.createElement("div"); wrap.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"; c.append(wrap);
    for (const key of ["mtp", "dflash"]) { const S = SW[key]; if (!S.pts.length) continue;
      const W = 540, H = 230, m = { l: 46, r: 10, t: 34, b: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
      const st = nice(Math.max(...S.pts.map(p => p.tpm))), max = Math.ceil(Math.max(...S.pts.map(p => p.tpm)) * 1.12 / st) * st;
      const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": S.title }, wrap);
      el("text", { x: m.l, y: 14 }, svg).textContent = S.title;
      for (let v = 0; v <= max + 1e-9; v += st) { const y = m.t + ih - v / max * ih;
        el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: "var(--grid)" }, svg);
        el("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, svg).textContent = v >= 1000 ? (v / 1000) + "k" : v; }
      const bw = Math.min(64, iw / S.pts.length - 14);
      S.pts.forEach((p, i) => { const cx = m.l + (i + 0.5) * iw / S.pts.length, h = p.tpm / max * ih, y = m.t + ih - h;
        const chosen = p.k === S.chosen;
        el("path", { d: barPath(cx - bw / 2, y, bw, h), fill: "#55524d", stroke: chosen ? "var(--ink)" : "none", "stroke-width": chosen ? 1.5 : 0 }, svg);
        el("text", { x: cx, y: y - 6, "text-anchor": "middle", class: "val" }, svg).textContent = p.tpm.toLocaleString();
        el("text", { x: cx, y: H - 26, "text-anchor": "middle" }, svg).textContent = (p.k ? p.k + (p.k === 1 ? " token" : " tokens") : "none") + (chosen ? " ✓" : "");
        el("text", { x: cx, y: H - 10, "text-anchor": "middle" }, svg).textContent = p.acc != null ? Math.round(p.acc * 100) + "% kept" : "–";
        const hit = el("rect", { x: cx - bw / 2, y: m.t, width: bw, height: ih, fill: "transparent" }, svg);
        hit.addEventListener("mousemove", e => show(e, `${S.title.split(" · ")[0]}, ${p.k} draft tokens<br><b>${p.tpm.toLocaleString()} TPM</b>${p.runs > 1 ? ` (mean of ${p.runs}: ${p.lo.toLocaleString()}–${p.hi.toLocaleString()})` : ""}<br>${p.acc != null ? Math.round(p.acc * 100) + "% of drafted tokens kept" : "no drafting"}`));
        hit.addEventListener("mouseleave", hide); }); } })();
  // the ladder: what each change added at that point in the sequence (repeats averaged)
  (() => { const L = C.ladder; if (!L.length) return;
    const W = 1140, H = 260, m = { l: 56, r: 14, t: 24, b: 50 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const st = nice(Math.max(...L.map(d => d.tpm))); const max = Math.ceil(Math.max(...L.map(d => d.tpm)) * 1.12 / st) * st;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "TPM by optimization step" },
      card("What each change added", "output TPM on the 40-request chat benchmark, one change per step, averaged over repeats · each gain is measured at that point in the sequence, so it depends on the steps before it", true));
    for (let v = 0; v <= max + 1e-9; v += st) { const y = m.t + ih - v / max * ih;
      el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: "var(--grid)" }, svg);
      el("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, svg).textContent = v >= 1000 ? (v / 1000) + "k" : v; }
    const bw = iw / L.length - 10;
    L.forEach((d, i) => { const x = m.l + i * (iw / L.length) + 5, h = d.tpm / max * ih, y = m.t + ih - h;
      const fill = i === 0 ? col.base : i === L.length - 1 ? col.best : "#55524d";  // baseline and final keep their colors; steps between are neutral
      el("path", { d: barPath(x, y, bw, h), fill }, svg);
      el("text", { x: x + bw / 2, y: y - 6, "text-anchor": "middle", class: "val" }, svg).textContent = d.tpm.toLocaleString() + (d.note ? " *" : "");
      el("text", { x: x + bw / 2, y: H - 28, "text-anchor": "middle" }, svg).textContent = d.step;
      if (i) { const prev = L[i - 1].tpm, pct = (d.tpm / prev - 1) * 100;
        el("text", { x: x + bw / 2, y: H - 12, "text-anchor": "middle" }, svg).textContent = Math.abs(pct) < 1.5 ? "tie (noise)" : (pct > 0 ? "+" : "") + Math.round(pct) + "%"; }
      const hit = el("rect", { x, y: m.t, width: bw, height: ih, fill: "transparent" }, svg);
      hit.addEventListener("mousemove", e => show(e, `${d.step}<br><b>${d.tpm.toLocaleString()} TPM</b>${d.runs > 1 ? ` (mean of ${d.runs}: ${d.lo.toLocaleString()}–${d.hi.toLocaleString()})` : ""} · ${d.p50} tok/s p50${d.note ? `<br>* ${d.note}` : ""}`));
      hit.addEventListener("mouseleave", hide); });
    const notes = L.filter(d => d.note).map(d => `* ${d.step}: ${d.note}`).join("<br>");
    const n = document.createElement("p"); n.innerHTML = notes; n.style.cssText = "margin:6px 0 0;font-size:11px;color:var(--faint);line-height:1.6"; svg.parentNode.append(n); })();
  // table view: every number above
  const rows = [["Benchmark", "Config", "TTFT p95", "tok/s p50", "tok/s p5", "TPM", "Accuracy"]];
  for (const g of groups) for (const s of ["base", "best"]) { const v = g.v[s]; if (!v) continue;
    const a = C.acc[s] && C.acc[s][g.name]; rows.push([g.name, nm[s], v.ttft95.toFixed(2) + "s", v.p50.toFixed(1), v.p5.toFixed(1), v.tpm.toLocaleString(), a != null ? a + "%" : "–"]); }
  $("#ctable").innerHTML = rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("");
})();
</script>
