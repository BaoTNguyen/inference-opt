# Live view of the vLLM server on :8001. docker compose -f grafana/docker-compose.yaml up -d
# Grafana: http://localhost:3001 (anonymous admin, local demo only). Prometheus: http://localhost:9090
# Published ports + host.docker.internal, so it works on Docker Desktop (a VM) and native Docker; 3001 because 3000 is taken here.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.1.0
    depends_on: [prometheus]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/grafana.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./grafana.json:/var/lib/grafana/dashboards/grafana.json:ro
